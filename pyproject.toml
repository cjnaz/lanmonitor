[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"


[project]
name = "lanmonitor"
version = "3.5a10"
    # 3.5a10 - lanmonfuncs, funcs_test.py cleanup
    # 3.5a9 - invoke for local.  fsactivity updated, tests passing.
    # 3.5a8 - cleanup touches, shlex in fsactivity and debug of backup folder protection
    # 3.5a7 - Update plugin tests part 1, rewrote fsactivity_plugin
    # 3.5a6 - More cleanup.  Tests refreshed/passing
    # 3.5a5 - Cleanup, config file params for connect
    # 3.5a4 - asyncssh further integeration & cleanup.  Split connect from run.
    # 3.5a3 - asyncssh integration (removed fabric) - initial version dirty
    # 3.5a2 - lanmonfuncs.cmd_check() revamp & tests - clean
    # 3.5a1 - Fabric/paramiko incorporation - functional
    # 3.4rc1 - Cleanup
    # 3.4a2 - Refactored lanmonitor.py, added cli sub-string match mode
    # 3.4a1 - command line run individual check items initial working version
    # 3.3.2 - yum_update_history_plugin - Added '--cacheonly', cjnfuncs 3.0 dependency, release
    # 3.3
    #   New freemem_plugin
    #   Dictionary-style monitor item definitions
    #   Support for cmd_timeout per monitored item
    #   Tolerate temporarily missing config file
description = "Monitor the state of services, processes, web pages, file system, etc. on your server and LAN"
readme = "README.md"
requires-python = ">=3.9"       # RHEL 9 uses 3.9
authors = [ {name = "Chris Nelson", email = "github@cjnaz.com"} ]
license = "MIT"
dependencies = [
    'cjnfuncs >= 3.0',
    # 'fabric >= 3.2.2',
    'asyncssh >= 2.21.0',
    'invoke >= 2.2.0',
    'importlib-metadata; python_version<"3.8"',
    ]
classifiers = [                 # https://pypi.org/classifiers/
    "Topic :: System :: Monitoring",
    "Topic :: System :: Networking :: Monitoring",
    ]


[project.scripts]
lanmonitor = "lanmonitor.lanmonitor:cli"


[project.urls]
repository = "https://github.com/cjnaz/lanmonitor"


[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["deployment_files/*"]